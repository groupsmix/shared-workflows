name: Security

on:
  workflow_call:
    inputs:
      language:
        description: "Primary language: node, python, or both"
        required: true
        type: string
        default: "node"
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      package-manager:
        description: "Package manager: npm, yarn, pnpm, pip, or poetry"
        required: false
        type: string
        default: "npm"
      run-codeql:
        description: "Enable CodeQL static analysis"
        required: false
        type: boolean
        default: false
      codeql-languages:
        description: "Comma-separated CodeQL languages (e.g., javascript, python)"
        required: false
        type: string
        default: "javascript"
      severity-threshold:
        description: "Minimum severity to fail on: low, moderate, high, critical"
        required: false
        type: string
        default: "high"
      working-directory:
        description: "Working directory for all commands"
        required: false
        type: string
        default: "."

jobs:
  dependency-audit-node:
    if: inputs.language == 'node' || inputs.language == 'both'
    name: Dependency Audit (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run npm audit
        if: inputs.package-manager == 'npm'
        run: npm audit --audit-level=${{ inputs.severity-threshold }}
        continue-on-error: true

      - name: Run yarn audit
        if: inputs.package-manager == 'yarn'
        run: yarn audit --level ${{ inputs.severity-threshold }}
        continue-on-error: true

      - name: Run pnpm audit
        if: inputs.package-manager == 'pnpm'
        run: pnpm audit --audit-level ${{ inputs.severity-threshold }}
        continue-on-error: true

  dependency-audit-python:
    if: inputs.language == 'python' || inputs.language == 'both'
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Poetry
        if: inputs.package-manager == 'poetry'
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "poetry" ]; then
            poetry install
          else
            pip install -r requirements.txt
          fi

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          if [ "${{ inputs.package-manager }}" = "poetry" ]; then
            poetry run pip-audit
          else
            pip-audit
          fi
        continue-on-error: true

  codeql:
    if: inputs.run-codeql
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(format('["{0}"]', join(fromJson(format('["{0}"]', inputs.codeql-languages)), '","'))) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.codeql-languages }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
