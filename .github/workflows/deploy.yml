name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment name (e.g., production, staging)"
        required: false
        type: string
        default: "production"
      deploy-command:
        description: "Custom deploy command to run"
        required: true
        type: string
      language:
        description: "Primary language: node, python, or other"
        required: false
        type: string
        default: "node"
      node-version:
        description: "Node.js version to use"
        required: false
        type: string
        default: "20"
      python-version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"
      package-manager:
        description: "Package manager: npm, yarn, pnpm, pip, or poetry"
        required: false
        type: string
        default: "npm"
      install-command:
        description: "Custom install command (overrides default)"
        required: false
        type: string
        default: ""
      build-command:
        description: "Custom build command to run before deploy (leave empty to skip)"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Working directory for all commands"
        required: false
        type: string
        default: "."
    secrets:
      deploy-token:
        description: "Deployment token/key (e.g., Vercel, Netlify, AWS, etc.)"
        required: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        if: inputs.language == 'node' && inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Poetry
        if: inputs.language == 'python' && inputs.package-manager == 'poetry'
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
          PKG_MGR: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          elif [ "${{ inputs.language }}" = "node" ]; then
            if [ "$PKG_MGR" = "yarn" ]; then
              yarn install --frozen-lockfile
            elif [ "$PKG_MGR" = "pnpm" ]; then
              pnpm install --frozen-lockfile
            else
              npm ci
            fi
          elif [ "${{ inputs.language }}" = "python" ]; then
            if [ "$PKG_MGR" = "poetry" ]; then
              poetry install
            else
              pip install -r requirements.txt
            fi
          fi

      - name: Build (optional)
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.deploy-token }}
        run: ${{ inputs.deploy-command }}
