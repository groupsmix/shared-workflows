name: Stale

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: "Days of inactivity before marking as stale"
        required: false
        type: number
        default: 60
      days-before-close:
        description: "Days after stale label before closing"
        required: false
        type: number
        default: 14
      stale-issue-message:
        description: "Message to post on stale issues"
        required: false
        type: string
        default: "This issue has been automatically marked as stale because it has not had any activity in the last 60 days. It will be closed in 14 days if no further activity occurs."
      stale-pr-message:
        description: "Message to post on stale PRs"
        required: false
        type: string
        default: "This pull request has been automatically marked as stale because it has not had any activity in the last 60 days. It will be closed in 14 days if no further activity occurs."
      close-issue-message:
        description: "Message to post when closing stale issues"
        required: false
        type: string
        default: "This issue was closed because it has been stale with no activity."
      close-pr-message:
        description: "Message to post when closing stale PRs"
        required: false
        type: string
        default: "This PR was closed because it has been stale with no activity."
      stale-issue-label:
        description: "Label to apply to stale issues"
        required: false
        type: string
        default: "stale"
      stale-pr-label:
        description: "Label to apply to stale PRs"
        required: false
        type: string
        default: "stale"
      exempt-issue-labels:
        description: "Comma-separated labels that prevent stale marking on issues"
        required: false
        type: string
        default: "pinned,security,bug"
      exempt-pr-labels:
        description: "Comma-separated labels that prevent stale marking on PRs"
        required: false
        type: string
        default: "pinned,security"
      only-issues:
        description: "Only process issues (skip PRs)"
        required: false
        type: boolean
        default: false
      only-prs:
        description: "Only process PRs (skip issues)"
        required: false
        type: boolean
        default: false
      operations-per-run:
        description: "Maximum number of operations per run"
        required: false
        type: number
        default: 100

jobs:
  stale:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Run stale action
        uses: actions/stale@v9
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-message: ${{ inputs.stale-issue-message }}
          stale-pr-message: ${{ inputs.stale-pr-message }}
          close-issue-message: ${{ inputs.close-issue-message }}
          close-pr-message: ${{ inputs.close-pr-message }}
          stale-issue-label: ${{ inputs.stale-issue-label }}
          stale-pr-label: ${{ inputs.stale-pr-label }}
          exempt-issue-labels: ${{ inputs.exempt-issue-labels }}
          exempt-pr-labels: ${{ inputs.exempt-pr-labels }}
          only-labels: ""
          operations-per-run: ${{ inputs.operations-per-run }}
